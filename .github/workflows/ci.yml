name: Node.js CI

on:
  push:
    branches: [ main, 'feat/**', 'fix/**', 'chore/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests (LiDAR & HUD Cockpit Suite)
        run: npm test
